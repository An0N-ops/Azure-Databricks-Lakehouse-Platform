name: Markdown Linting

on:
  push:
    branches: [ main, "release/*" ]
    paths:
      - '**.md'
  pull_request:
    branches: [ main, "release/*" ]
    paths:
      - '**.md'

jobs:
  markdown-lint:
    name: Lint Markdown Files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run markdownlint
        uses: DavidAnson/markdownlint-cli2-action@v24
        with:
          globs: '**/*.md'
