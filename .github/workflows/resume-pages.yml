name: Publish Resume to GitHub Pages

on:
  push:
    branches: [ main ]
    paths:
      - 'credentials/resume/**'
      - '.github/workflows/resume-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Prepare Resume Page
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Stage Resume as Site Index
        run: |
          mkdir -p site/resume
          cp credentials/resume/resume.html site/resume/index.html
          cat > site/index.html <<'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
          <meta charset="utf-8">
          <meta http-equiv="refresh" content="0; url=./resume/">
          <title>Gaurav Sahu — Azure Data Engineer | Data Platform Consultant</title>
          <script>location.replace('./resume/');</script>
          </head>
          <body>
          <p>Resume: <a href="./resume/">Gaurav Sahu — Azure Data Engineer | Data Platform Consultant</a></p>
          </body>
          </html>
          EOF

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
